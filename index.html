<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>糸リフトUGC 撮影チェック</title>
<style>
:root { --ink:#1f1d1a; --muted:#625d56; --plane:#f3f1ed; --plane2:#e8e5e0; --rose:#a8405f; --blue:#35607d; --top:0px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { color: var(--ink); background: #fff; scroll-behavior: smooth; }
body { margin: 0; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.55; word-break: auto-phrase; line-break: strict; padding-bottom: 96px;
  max-width: 720px; margin: 0 auto; }
p, h1, h2, h3, ul, ol { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 10; background: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
.bar1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 16px; }
.prog { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prog b { color: var(--ink); font-size: 17px; }
.meter { height: 4px; background: var(--plane2); margin-top: 8px; }
.meter span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
.tabs { display: flex; gap: 4px; margin-top: 10px; }
.tabs button { flex: 1; padding: 9px 0 10px; font-size: 13px; color: var(--muted); background: var(--plane); white-space: nowrap; }
.tabs button.on { background: var(--ink); color: #fff; font-weight: 700; }
.tools { padding: 10px 0 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 10px; background: var(--plane); font-size: 13px; white-space: nowrap; }
.chip b { margin-right: 4px; }
.chip .n { color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.chip.done { background: var(--plane2); color: var(--muted); }
.filter { display: flex; gap: 6px; padding: 8px 16px 0; }
.filter button { padding: 5px 12px; font-size: 13px; background: var(--plane); color: var(--muted); }
.filter button.on { background: var(--ink); color: #fff; }
.view { display: none; }
.view.on { display: block; }

.step { padding: 18px 16px 4px; scroll-margin-top: var(--top); }
.step-no { font-size: 13px; font-weight: 700; color: var(--rose); }
.step h2 { font-size: 19px; line-height: 1.4; }
.step-meta { font-size: 13px; margin-top: 2px; }
.step-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
.step-done { font-size: 13px; color: var(--muted); padding: 10px 0; }
.cut { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 14px 0; scroll-margin-top: calc(var(--top) + 8px); transition: background .3s; }
.cut + .cut { border-top: 1px solid var(--plane2); }
.cut.flash, .row.flash { background: #f7ecef; }
.pic svg, .pic img { display: block; width: 84px; height: auto; aspect-ratio: 9 / 16; object-fit: cover; background: var(--plane2); }
.pic button { display: block; }
.head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.no { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.tag { padding: 1px 6px; color: #fff; font-size: 11px; }
.tag.lift { background: var(--rose); } .tag.kuma { background: var(--blue); } .tag.common { background: #7a746c; }
.ppl { color: var(--muted); }
.state { margin-left: auto; font-size: 12px; font-weight: 700; }
.state.ok { color: var(--muted); } .state.retake { color: var(--rose); }
.scene { font-weight: 700; font-size: 16px; line-height: 1.45; margin-top: 3px; }
.how { font-size: 13px; margin-top: 3px; }
.point { font-size: 14px; color: #3d3934; margin-top: 2px; }
.look { font-size: 12px; color: var(--muted); margin-top: 3px; }
.refs { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; overflow-x: auto; }
.ref { flex: none; width: 76px; text-align: left; }
.ref img { display: block; width: 76px; height: 135px; object-fit: cover; background: var(--plane2); }
.ref span { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 3px; }
.ref-label { font-size: 12px; color: var(--muted); margin-top: 10px; }
.acts { display: flex; gap: 8px; margin-top: 12px; }
.acts button { padding: 9px 0; flex: 1; background: var(--plane); font-size: 14px; font-weight: 700; }
.acts .b-ok.on { background: var(--ink); color: #fff; }
.acts .b-re.on { background: var(--rose); color: #fff; }
.acts .b-memo { flex: .7; font-weight: 400; }
.memo { margin-top: 8px; display: none; }
.memo.show { display: block; }
.memo textarea { width: 100%; font: inherit; font-size: 16px; padding: 8px 10px; border: 0; background: var(--plane); resize: vertical; min-height: 44px; }
.memo-text { font-size: 13px; margin-top: 8px; background: var(--plane); padding: 6px 10px; white-space: pre-wrap; }
.cut.is-ok .scene, .cut.is-ok .how, .cut.is-ok .point, .cut.is-ok .pic { opacity: .45; }

.lstep { padding: 16px 16px 2px; scroll-margin-top: var(--top); }
.lstep-h { display: flex; align-items: baseline; gap: 8px; padding-bottom: 4px; }
.lstep-h .step-no { flex: none; }
.lstep-h h2 { font-size: 16px; line-height: 1.4; }
.lstep-h .n { margin-left: auto; flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lstep-meta { font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.row { display: grid; grid-template-columns: 48px 1fr; align-items: center; scroll-margin-top: calc(var(--top) + 8px); transition: background .3s; }
.row + .row { border-top: 1px solid var(--plane2); }
.ck { width: 48px; height: 52px; display: flex; align-items: center; justify-content: flex-start; }
.ck i { width: 26px; height: 26px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; }
.ck i svg { width: 18px; height: 18px; display: none; }
.row.is-ok .ck i { background: var(--ink); }
.row.is-ok .ck i svg { display: block; }
.row-go { text-align: left; padding: 8px 0; width: 100%; }
.row-t { font-size: 15px; line-height: 1.45; }
.row-t b { font-variant-numeric: tabular-nums; margin-right: 6px; }
.row-s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.row-s .re { color: var(--rose); font-weight: 700; margin-right: 6px; }
.row.is-ok .row-t { color: var(--muted); text-decoration: line-through; text-decoration-color: #b3ada5; }

.zoom { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; }
.zoom[hidden] { display: none; }
.zoom img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.zoom p { color: #fff; font-size: 14px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }

.refgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; padding: 16px; align-items: start; }
.refgrid .ref { width: auto; }
.refgrid .ref img { width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: cover; }
.refgrid .ref b { display: block; font-size: 13px; margin-top: 4px; line-height: 1.35; }
.ref-lead { padding: 16px 16px 0; font-size: 13px; color: var(--muted); }

.info { padding: 16px; }
.info h2 { font-size: 17px; margin: 22px 0 8px; }
.info h2:first-child { margin-top: 0; }
.flow li { padding: 8px 0; }
.flow li + li { border-top: 1px solid var(--plane2); }
.flow b { color: var(--rose); margin-right: 6px; }
.flow span { display: block; font-size: 13px; color: var(--muted); }
.rules { padding-left: 20px; font-size: 14px; }
.rules li { margin-bottom: 6px; }
.cams { font-size: 14px; }
.cams p { margin-bottom: 6px; }
.cams b { margin-right: 6px; }
.btns { display: grid; gap: 8px; }
.btns button, .btns a { display: block; text-align: center; padding: 12px; background: var(--plane); font-size: 15px; color: inherit; text-decoration: none; }
.btns .danger { color: var(--rose); }
.small { font-size: 12px; color: var(--muted); margin-top: 8px; }

.next { position: fixed; right: max(16px, calc(50vw - 344px)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 11; background: var(--ink); color: #fff;
  padding: 13px 18px; font-size: 15px; font-weight: 700; }
.next[hidden] { display: none; }

.viewer { position: fixed; inset: 0; z-index: 20; background: #000; color: #fff; display: flex; flex-direction: column; }
.viewer[hidden] { display: none; }
.v-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
.v-head p { font-size: 15px; font-weight: 700; }
.v-head button { padding: 8px 14px; background: #2c2a27; color: #fff; }
.viewer video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; }
.v-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
.v-nav button { padding: 10px 18px; background: #2c2a27; color: #fff; }
.v-nav button:disabled { opacity: .3; }
.v-nav p { font-size: 13px; color: #c9c4bd; }
</style>
</head>

wo_back": ["2人・後ろ姿", "並んで歩く後ろ姿"]}, "cams": [["自撮り", "演者が内カメラで撮る。UGCらしさが一番出る撮り方"], ["鏡越し", "鏡に映った顔を撮る。撮影者とスマホが鏡に映らない角度で"], ["他撮り", "撮影者が手持ちで撮る。動きに合わせて寄り・引きを調整"], ["固定", "三脚などに置いて撮る。手元・風景・一連の動作向き"], ["主観", "演者の目線の高さから撮る（足元を見下ろす等）"], ["画面収録", "スマホの画面録画を手元撮影と併用する"]], "rules": ["縦位置（9:16）で撮る。", "1カットは動作の前後に2秒ずつ余白を残し、5〜10秒を目安に。", "余裕があれば同じカットを「寄り」と「引き」の2パターン撮っておく。", "他社のロゴ・商品名・店名、通行人の顔は映さない。", "鏡越しのカットは、撮影者とスマホが鏡に映らない角度で。", "施術前後を見比べられる構図（同じ画角で並べる撮り方）は避け、施術後のイメージは表情と仕草で表す。", "車内は運転中に撮らない。駅・商業施設・飲食店は撮影可否を事前に確認する。"], "pdf": ""};
const KEY = "itolift-ugc-shoot-v1";
const PROD = { "糸リフト": "lift", "クマ取り": "kuma", "共通": "common" };
const ORDER = D.steps.flatMap(s => s.cuts);
const IMGS = new Set(D.imgs);
const CHECK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3"/></svg>`;
let st = load();
let filter = "all";
let tab = "cuts";

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { localStorage.setItem(KEY, JSON.stringify(st)); }
function get(no) { return st[no] || {}; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const $ = id => document.getElementById(id);

function refThumb(r, list, i) {
  const ref = D.refs[r];
  return `<button class="ref" data-list="${list.join(",")}" data-i="${i}"><img src="ref/${r}.jpg" alt="" loading="lazy"><span>${esc(ref.title)}</span></button>`;
}

function cutHtml(no) {
  const c = D.cuts[no], s = get(no);
  const refs = c.refs.length
    ? `<p class="ref-label">参考動画</p><div class="refs">${c.refs.map((r, i) => refThumb(r, c.refs, i)).join("")}</div>` : "";
  const state = s.s === "ok" ? `<span class="state ok">撮影済み</span>` : s.s === "retake" ? `<span class="state retake">撮り直し</span>` : "";
  return `<article class="cut${s.s === "ok" ? " is-ok" : ""}" id="cut-${no}" data-no="${no}">
    <div class="pic">${IMGS.has(no) ? `<button data-zoom="${no}"><img src="img/${no}.jpg" alt="" loading="lazy"></button>` : D.svgs[c.shot]}</div>
    <div>
      <p class="head"><span class="no">No.${no}</span><span class="tag ${PROD[c.product] || "common"}">${esc(c.product)}</span><span class="ppl">${esc(c.people)}</span>${state}</p>
      <p class="scene">${esc(c.scene)}</p>
      <p class="how">${esc(c.shotLabel)}／${esc(c.cam)}</p>
      <p class="point">${esc(c.point)}</p>
      <p class="look">${esc(c.look)}</p>
      ${refs}
      ${s.m ? `<p class="memo-text">${esc(s.m)}</p>` : ""}
      <div class="acts">
        <button class="b-ok${s.s === "ok" ? " on" : ""}" data-act="ok">OK</button>
        <button class="b-re${s.s === "retake" ? " on" : ""}" data-act="retake">撮り直し</button>
        <button class="b-memo" data-act="memo">メモ</button>
      </div>
      <div class="memo"><textarea rows="2" placeholder="テイク番号・気づいたこと">${esc(s.m || "")}</textarea></div>
    </div>
  </article>`;
}

function visible(no) {
  const s = get(no).s;
  if (filter === "todo") return s !== "ok";
  if (filter === "retake") return s === "retake";
  return true;
}

function rowHtml(no) {
  const c = D.cuts[no], s = get(no);
  return `<div class="row${s.s === "ok" ? " is-ok" : ""}" id="row-${no}" data-no="${no}">
    <button class="ck" data-act="ok" aria-label="No.${no} 撮影済み"><i>${CHECK}</i></button>
    <button class="row-go"><p class="row-t"><b>${no}</b>${esc(c.scene)}</p>
      <p class="row-s">${s.s === "retake" ? `<span class="re">撮り直し</span>` : ""}${esc(c.shotLabel)}／${esc(c.cam)}・${esc(c.people)}${s.m ? "・メモあり" : ""}</p></button>
  </div>`;
}

function emptyText() { return filter === "retake" ? "撮り直しのカットはありません" : "このステップはすべて撮影済みです"; }

function renderChecklist() {
  $("clist").innerHTML = D.steps.map((s, i) => {
    const rows = s.cuts.filter(visible);
    const d = s.cuts.filter(n => get(n).s === "ok").length;
    return `<section class="lstep" id="lstep-${i + 1}">
      <div class="lstep-h"><p class="step-no">STEP${i + 1}</p><h2>${esc(s.title)}</h2><span class="n">${d}/${s.cuts.length}</span></div>
      <p class="lstep-meta">${esc(s.look)} ／ 出演 ${esc(s.cast)}</p>
      ${rows.length ? rows.map(rowHtml).join("") : `<p class="step-done">${emptyText()}</p>`}
    </section>`;
  }).join("");
}

function renderList() {
  renderChecklist();
  $("list").innerHTML = D.steps.map((s, i) => {
    const cuts = s.cuts.filter(visible);
    const body = cuts.length ? cuts.map(cutHtml).join("") : `<p class="step-done">${emptyText()}</p>`;
    return `<section class="step" id="step-${i + 1}">
      <p class="step-no">STEP${i + 1}</p>
      <h2>${esc(s.title)}</h2>
      <p class="step-meta">${esc(s.place)} ／ ${esc(s.look)} ／ 出演 ${esc(s.cast)}</p>
      <p class="step-note">${esc(s.note)}</p>
      ${body}
    </section>`;
  }).join("");
  renderProgress();
}

function renderProgress() {
  const done = ORDER.filter(n => get(n).s === "ok").length;
  const re = ORDER.filter(n => get(n).s === "retake").length;
  $("prog").innerHTML = `<b>${done}</b> / ${ORDER.length}${re ? `　撮り直し ${re}` : ""}`;
  $("meter").style.width = (done / ORDER.length * 100) + "%";
  $("chips").innerHTML = D.steps.map((s, i) => {
    const d = s.cuts.filter(n => get(n).s === "ok").length;
    return `<button class="chip${d === s.cuts.length ? " done" : ""}" data-step="${i + 1}"><b>${i + 1}</b>${esc(s.title)}<span class="n">${d}/${s.cuts.length}</span></button>`;
  }).join("");
  $("next").hidden = done === ORDER.length || (tab !== "cuts" && tab !== "list");
}

function setTop() { document.documentElement.style.setProperty("--top", $("top").offsetHeight + "px"); }

function renderRefs() {
  const all = Object.keys(D.refs).map(Number);
  $("refgrid").innerHTML = all.map((r, i) => {
    const ref = D.refs[r];
    const used = ref.cuts.length ? `カット ${ref.cuts.map(n => "No." + n).join("・")}` : "全体の雰囲気の参考";
    return `<button class="ref" data-list="${all.join(",")}" data-i="${i}"><img src="ref/${r}.jpg" alt="" loading="lazy"><b>${r}. ${esc(ref.title)}</b><span>${used}</span></button>`;
  }).join("");
}

function renderInfo() {
  const flow = D.steps.map((s, i) => `<li><b>STEP${i + 1}</b>${esc(s.title)}（${s.cuts.length}カット）<span>${esc(s.time)} ／ ${esc(s.look)} ／ 出演 ${esc(s.cast)}</span></li>`).join("");
  $("info").innerHTML = `
    <h2>撮影の流れ</h2>
    <ol class="flow" style="list-style:none;padding:0">${flow}</ol>
    <p class="small">Aは主演、Bは友達役。2日に分ける場合は、Day1を室内（STEP1〜5と11）、Day2を屋外（STEP6〜10）にします。</p>
    <h2>撮影の共通ルール</h2>
    <ul class="rules">${D.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>撮り方の意味</h2>
    <div class="cams">${D.cams.map(([n, d]) => `<p><b>${esc(n)}</b>${esc(d)}</p>`).join("")}</div>
    <h2>チェックの管理</h2>
    <div class="btns">
      <button id="copy">進捗をテキストでコピー</button>
      ${D.pdf ? `<a href="${D.pdf}" target="_blank">PDF版を開く</a>` : ""}
      <button id="reset" class="danger">チェックとメモをすべて消す</button>
    </div>
    <p class="small">チェックとメモは、このスマホのブラウザに保存されます。別のスマホとは共有されないので、共有したいときは「進捗をテキストでコピー」でチャットに貼ってください。</p>`;
  $("copy").onclick = copyProgress;
  $("reset").onclick = () => {
    if (!confirm("撮影済み・撮り直し・メモをすべて消します。よろしいですか？")) return;
    st = {}; save(); renderList();
  };
}

function copyProgress() {
  const lines = [`糸リフトUGC 撮影進捗 ${ORDER.filter(n => get(n).s === "ok").length}/${ORDER.length}`];
  D.steps.forEach((s, i) => {
    const todo = s.cuts.filter(n => get(n).s !== "ok");
    lines.push(`STEP${i + 1} ${s.title}: ${todo.length ? "残り " + todo.map(n => "No." + n + (get(n).s === "retake" ? "(撮り直し)" : "")).join(" ") : "完了"}`);
  });
  const memos = ORDER.filter(n => get(n).m).map(n => `No.${n} ${get(n).m}`);
  if (memos.length) lines.push("", "メモ", ...memos);
  const text = lines.join("\n");
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => alert("コピーしました"));
  else alert(ok ? "コピーしました" : text);
}

function setStatus(no, val) {
  const s = get(no);
  s.s = s.s === val ? undefined : val;
  st[no] = s; save();
  if (!visible(no)) { renderList(); return; }
  const el = $("cut-" + no);
  if (el) {
    const open = el.querySelector(".memo").classList.contains("show");
    el.outerHTML = cutHtml(no);
    if (open) $("cut-" + no).querySelector(".memo").classList.add("show");
  }
  renderChecklist();
  renderProgress();
}

function showTab(name) {
  tab = name;
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  ["cuts", "list", "refs", "info"].forEach(t => $("v-" + t).classList.toggle("on", t === name));
  $("tools").style.display = name === "cuts" || name === "list" ? "" : "none";
  setTop(); renderProgress();
}

function flash(el) { el.scrollIntoView(); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); }

document.addEventListener("click", e => {
  const ref = e.target.closest(".ref");
  if (ref) { openViewer(ref.dataset.list.split(",").map(Number), Number(ref.dataset.i)); return; }
  const z = e.target.closest("[data-zoom]");
  if (z) { openZoom(Number(z.dataset.zoom)); return; }
  const go = e.target.closest(".row-go");
  if (go) { showTab("cuts"); flash($("cut-" + go.closest(".row").dataset.no)); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const no = Number(act.closest("[data-no]").dataset.no);
    if (act.dataset.act === "memo") {
      const m = act.closest(".cut").querySelector(".memo");
      m.classList.toggle("show");
      if (m.classList.contains("show")) m.querySelector("textarea").focus();
    } else setStatus(no, act.dataset.act);
    return;
  }
  const chip = e.target.closest(".chip");
  if (chip) { $((tab === "list" ? "lstep-" : "step-") + chip.dataset.step).scrollIntoView(); return; }
  const f = e.target.closest("[data-f]");
  if (f) {
    filter = f.dataset.f;
    document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b === f));
    renderList(); window.scrollTo(0, 0); return;
  }
  const t = e.target.closest("[data-tab]");
  if (t) { showTab(t.dataset.tab); window.scrollTo(0, 0); }
});

document.addEventListener("change", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const no = Number(e.target.closest(".cut").dataset.no);
  const s = get(no); s.m = e.target.value.trim() || undefined; st[no] = s; save();
  $("cut-" + no).outerHTML = cutHtml(no);
  renderChecklist();
});

$("next").onclick = () => {
  if (filter === "retake") { filter = "all"; document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === "all")); renderList(); }
  const no = ORDER.find(n => get(n).s !== "ok");
  const el = no && $((tab === "list" ? "row-" : "cut-") + no);
  if (el) flash(el);
};

function openZoom(no) {
  $("z-title").textContent = `No.${no} ${D.cuts[no].scene}`;
  $("z-img").src = `img/${no}.jpg`;
  $("zoom").hidden = false; document.body.style.overflow = "hidden";
}
$("z-close").onclick = () => { $("zoom").hidden = true; document.body.style.overflow = ""; };

let vList = [], vi = 0;
function openViewer(list, i) { vList = list; vi = i; $("viewer").hidden = false; document.body.style.overflow = "hidden"; showVideo(); }
function showVideo() {
  const r = vList[vi], v = $("v-video");
  $("v-title").textContent = `${r}. ${D.refs[r].title}`;
  $("v-count").textContent = `${vi + 1} / ${vList.length}`;
  $("v-prev").disabled = vi === 0; $("v-next").disabled = vi === vList.length - 1;
  v.poster = `ref/${r}.jpg`; v.src = `ref/${r}.mp4`; v.play().catch(() => {});
}
function closeViewer() { const v = $("v-video"); v.pause(); v.removeAttribute("src"); v.load(); $("viewer").hidden = true; document.body.style.overflow = ""; }
$("v-close").onclick = closeViewer;
$("v-prev").onclick = () => { if (vi > 0) { vi--; showVideo(); } };
$("v-next").onclick = () => { if (vi < vList.length - 1) { vi++; showVideo(); } };

renderList(); renderRefs(); renderInfo(); setTop();
window.addEventListener("resize", setTop);
</script>
</body>
</html>
